# -------------------------------------------------------
# Mr.Robots — AI Governance Gateway
# docker-compose up --build
# -------------------------------------------------------

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mr_robots_gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist audit logs outside the container
      - ./logs:/app/logs
      # Persist HuggingFace model cache (avoids re-downloading on restart)
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  huggingface_cache:
